version: '3.0'

services:
  grafana:
    container_name: 'grafana-appwithserviceaccount-app'
    build:
      context: ./.config
      args:
        grafana_version: ${GRAFANA_VERSION:-12.0.3}
    ports:
      - 3000:3000/tcp
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=${GF_FEATURE_TOGGLES_ENABLE:-accessControlOnCall,idForwarding,externalServiceAccounts}
      - GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED=${GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED:-true}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=${GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS:-grafana-appwithserviceaccount-app}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=debug
      # - GF_DATABASE_PATH=/srv/grafana-appwithserviceaccount-app/grafana.db
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-appwithserviceaccount-app
      - ./provisioning:/etc/grafana/provisioning
      # - ./:/srv/grafana-appwithserviceaccount-app
